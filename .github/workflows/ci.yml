name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{github.ref}}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The 4 a.m. day boundaries lean on Intl.DateTimeFormat, whose ICU data drifts
        # between Node majors, so the suite runs on both the oldest and newest supported.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.node-version}}
          cache: npm
      - run: npm ci
      - run: npm test
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{runner.os}}-next-${{hashFiles('package-lock.json')}}-${{hashFiles('app/**','components/**','lib/**')}}
          restore-keys: |
            ${{runner.os}}-next-${{hashFiles('package-lock.json')}}-
      - run: npm ci
      - run: npm run build
